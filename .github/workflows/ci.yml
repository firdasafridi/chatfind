name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: System packages (OCR, used by the ingest tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ind
      - name: Install
        # CPU-only torch keeps the install small; tests use fake models and never download weights.
        run: pip install -r app/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Test (coverage gate 90%)
        working-directory: app
        run: python -m pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint + typecheck
        run: pnpm run check
      - name: Unit tests (coverage gate 90%)
        run: pnpm run coverage
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/web/playwright-report
          retention-days: 7
